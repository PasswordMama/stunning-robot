name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract the zip
        run: |
          ZIP=$(ls -t *.zip | head -n 1)
          if [ -z "$ZIP" ]; then echo "No .zip found in the repo root"; exit 1; fi
          echo "Extracting $ZIP"
          rm -rf build-src
          mkdir build-src
          unzip -q "$ZIP" -d build-src
          POM=$(find build-src -name pom.xml -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$POM" ]; then echo "No pom.xml inside the zip"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

      - name: Build
        run: mvn -B -f "$PROJECT_DIR/pom.xml" package

      - uses: actions/upload-artifact@v4
        with:
          name: CaneIslands
          path: ${{ env.PROJECT_DIR }}/target/CaneIslands.jar
